<!doctype html>
<html lang="en" style="background-color: #000516;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeSite Studio v2</title>

    <style>
      /* Prevent white flash before CSS loads */
      html, body, #root {
        background-color: #000516 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Root loader layout */
      .root-loader-wrapper {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000516;
        z-index: 99999;
      }

      /* Ambient background glow */
      .root-glow {
        position: absolute;
        width: 350px;
        height: 350px;
        background: rgba(109, 40, 217, 0.25);
        filter: blur(100px);
        border-radius: 50%;
        pointer-events: none;
      }

      /* Animated spinner ring */
      .root-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(30, 41, 59, 0.8);
        border-top: 3px solid #00FFFF;
        border-radius: 50%;
        animation: root-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      /* Brand text styling */
      .root-brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ffffff;
      }

      .root-brand span {
        color: #00FFFF;
      }

      @keyframes root-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #000516;">
    <div id="root">
      <!-- HTML loader renders immediately on reload before JS execution -->
      <div class="root-loader-wrapper">
        <div class="root-glow"></div>
        <div class="root-spinner"></div>
        <div class="root-brand">VibeSite<span> Studio</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
